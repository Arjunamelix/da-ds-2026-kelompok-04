# Demo lokal di laptop: PostgreSQL + backend Go + layanan ML (FastAPI) + scraper SIMPANG (FastAPI) + frontend (nginx).
# Jalankan:  cp .env.example .env  (isi POSTGRES_PASSWORD)  lalu  docker compose up --build
# Web di http://localhost:3000 (atau FRONTEND_HOST_PORT).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-harga_pangan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pangan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-harga_pangan}?sslmode=disable
      ML_URL: http://ml:8000
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8000}
      APP_ENV: ${APP_ENV:-dev}
      BACKEND_PORT: "8080"
      REFERENSI_PATH: /app/config/referensi.json
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

  ml:
    build: ./ml
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pangan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-harga_pangan}?sslmode=disable
      ML_MIN_HARI: ${ML_MIN_HARI:-90}
    depends_on:
      db:
        condition: service_healthy

  # Pengambil data harga otomatis dari SIMPANG: saat menyala, lalu setiap hari pada SCRAPER_JADWAL (WIB).
  # Menambah data baru ke data/raw/master_data_harian.csv dan ke database (lewat backend), tanpa duplikat.
  # Tidak dibuka ke luar Docker; dashboard memakainya lewat backend (/api/scraper/...).
  scraper:
    build: ./scraper
    environment:
      BACKEND_URL: http://backend:8080
      DATA_DIR: /data
      SCRIPTS_DIR: /app/etl
      TZ: Asia/Jakarta
      SCRAPER_AKTIF: ${SCRAPER_AKTIF:-1}
      SCRAPER_JADWAL: ${SCRAPER_JADWAL:-10:00,16:00}
      SCRAPER_KONTAK: ${SCRAPER_KONTAK:-}
      SCRAPER_TULIS_MASTER: ${SCRAPER_TULIS_MASTER:-1}
    volumes:
      - ./data:/data
      - ./etl:/app/etl:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  pgdata: