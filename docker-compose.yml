# Demo lokal di laptop: PostgreSQL + backend Go + layanan ML (FastAPI) + frontend (nginx).
# Jalankan:  cp .env.example .env  (isi POSTGRES_PASSWORD)  lalu  docker compose up --build
# Web di http://localhost:3000 (atau FRONTEND_HOST_PORT).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-harga_pangan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pangan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-harga_pangan}?sslmode=disable
      ML_URL: http://ml:8000
      APP_ENV: ${APP_ENV:-dev}
      BACKEND_PORT: "8080"
      REFERENSI_PATH: /app/config/referensi.json
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  ml:
    build: ./ml
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pangan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-harga_pangan}?sslmode=disable
      ML_MIN_HARI: ${ML_MIN_HARI:-90}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  pgdata:
